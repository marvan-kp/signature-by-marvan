services:
  - type: web
    name: signature-by-marvan
    env: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_FREE_TIER_LIMIT_BYTES
        value: 21474836480
